<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predmeti</title>
<link href="admin-predmeti.css" rel="stylesheet">
<link href="css/admin-ui.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<nav class="sidebar" aria-label="Glavni meni">
    <a class="icon" href="admin-dashboard.html" aria-label="Nadzorna plošča" title="Nadzorna plošča">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </a>
    <a class="icon" href="admin_uporabniki.html" aria-label="Uporabniki" title="Uporabniki">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2c2.6.3 4.5 2.2 4.5 5.3"/></svg>
    </a>
    <a class="icon active" href="admin-predmeti.html" aria-label="Predmeti" aria-current="page" title="Predmeti">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>
    </a>
    <a class="icon" href="admin-koledar.html" aria-label="Koledar" title="Koledar">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
    </a>
    <div class="spacer"></div>
    <a class="icon" href="admin-nastavitve.html" aria-label="Nastavitve" title="Nastavitve">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10"/><path d="M18 7h2"/><path d="M4 17h2"/><path d="M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </a>
    <a class="icon" href="admin-profil.html" aria-label="Moj profil" title="Moj profil">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.2 18.2c1.2-2.2 3.2-3.2 5.8-3.2s4.6 1 5.8 3.2"/></svg>
    </a>
</nav>

<main class="content">

    <header class="page-header">
        <div>
            <h1>Predmeti in <span>razredi.</span></h1>
            <p id="headline">&nbsp;</p>
        </div>
        <div class="actions">
            <button class="btn" type="button" id="plansBtn">Učni načrti</button>
            <button class="btn btn-primary" type="button" id="addBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                Dodaj predmet
            </button>
        </div>
    </header>

    <section class="stats" aria-label="Povzetek">
        <div class="stat"><div class="bar" style="background:#8e849e"></div><div class="body">
            <div class="label">Aktivni razredi</div><div class="num" id="statClasses">0</div><div class="hint" id="statClassesHint">&nbsp;</div>
        </div></div>
        <div class="stat"><div class="bar" style="background:#7c8f55"></div><div class="body">
            <div class="label">Predmeti</div><div class="num" id="statSubjects">0</div><div class="hint">Z učnimi načrti</div>
        </div></div>
        <div class="stat"><div class="bar" style="background:#c96f4a"></div><div class="body">
            <div class="label">Brez učitelja</div><div class="num" id="statUnassigned">0</div><div class="hint">Potrebna dodelitev</div>
        </div></div>
    </section>

    <section aria-label="Seznam predmetov" style="display:flex; flex-direction:column; gap:20px">
        <div class="toolbar">
            <div class="tabs" id="tabs" role="group" aria-label="Filter predmetov"></div>
            <input class="search" id="search" type="search" placeholder="Išči predmet ali učitelja" aria-label="Išči predmete">
        </div>
        <div class="subjects" id="subjects"></div>
        <div class="count" id="shown"></div>
    </section>

    <section class="panel" aria-label="Razredi">
        <h2>Razredi po letnikih</h2>
        <div id="years"></div>
    </section>

</main>

<script src="js/admin.js"></script>
<script>
const BARS = ['#7c8f55', '#8e849e', '#b8912a', '#c4875f'];
const AVATARS = [
    { bg: '#d4debf', fg: '#44561f' },
    { bg: '#d9d1e2', fg: '#4f4463' },
    { bg: '#ebddb0', fg: '#6e5410' },
    { bg: '#ebd3c4', fg: '#7a3a1c' }
];

let data = { subjects: [], teachers: [], classes: [], stats: { classes: 0, years: 0, sections: 0, subjects: 0, unassigned: 0 } };
let filter = 'vsi';
let query = '';

const $ = (id) => document.getElementById(id);
const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const initials = (name) => name.split(' ').filter(Boolean).map((p) => p[0]).join('');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const unassignedCount = () => data.subjects.filter((s) => !s.teacher_id).length;
function plural(n, f1, f2, f34, f5) {
    const m = n % 100;
    return m === 1 ? f1 : m === 2 ? f2 : (m === 3 || m === 4) ? f34 : f5;
}

function renderStats() {
    const st = data.stats;
    $('headline').textContent =
        `${st.classes} ${plural(st.classes, 'aktiven razred', 'aktivna razreda', 'aktivni razredi', 'aktivnih razredov')} · ` +
        `${st.unassigned} ${plural(st.unassigned, 'predmet', 'predmeta', 'predmeti', 'predmetov')} brez učitelja`;
    $('statClasses').textContent = st.classes;
    $('statClassesHint').textContent = `${st.years} ${plural(st.years, 'letnik', 'letnika', 'letniki', 'letnikov')}, ${st.sections} ${plural(st.sections, 'oddelek', 'oddelka', 'oddelki', 'oddelkov')}`;
    $('statSubjects').textContent = data.subjects.length;
    $('statUnassigned').textContent = unassignedCount();
}

function renderTabs() {
    const defs = [
        { id: 'vsi',  label: 'Vsi predmeti',  count: data.subjects.length },
        { id: 'brez', label: 'Brez učitelja', count: unassignedCount() }
    ];
    $('tabs').innerHTML = defs.map((t) =>
        `<button type="button" class="tab ${t.id === filter ? 'active' : ''}" data-filter="${t.id}" aria-pressed="${t.id === filter}">${t.label} <span>${t.count}</span></button>`
    ).join('');
}

function renderSubjects() {
    const q = norm(query.trim());
    const list = data.subjects
        .map((s, i) => ({ ...s, idx: i }))
        .filter((s) =>
            (filter === 'vsi' || !s.teacher_id) &&
            (!q || norm(s.name).includes(q) || (s.teacher && norm(s.teacher).includes(q)))
        );
    $('subjects').innerHTML = list.length
        ? list.map((s) => {
            const un = !s.teacher_id;
            const av = AVATARS[s.idx % 4];
            return `
            <article class="subject ${un ? 'unassigned' : ''}">
                <div class="bar" style="background:${un ? '#c96f4a' : BARS[s.idx % 4]}"></div>
                <div class="body">
                    <h2>${esc(s.name)}</h2>
                    <div class="teacher">
                        <div class="avatar" style="background:${un ? '#f5e6df' : av.bg}; color:${un ? '#8a3f1f' : av.fg}">${un ? '?' : esc(initials(s.teacher))}</div>
                        <div>
                            <div class="eyebrow">Učitelj</div>
                            <div class="tname" style="color:${un ? '#8a3f1f' : 'inherit'}">${un ? 'Ni dodeljen' : esc(s.teacher)}</div>
                        </div>
                    </div>
                    <div>
                        <div class="eyebrow">Razredi</div>
                        <div class="chips">${s.classes.length ? s.classes.map((c) => `<span class="chip">${esc(c)}</span>`).join('') : '<span class="chip">—</span>'}</div>
                    </div>
                    <div style="display:flex; gap:8px; flex-wrap:wrap">
                        ${un ? `<button type="button" class="btn btn-primary" data-act="assign" data-id="${s.id}">Dodeli učitelja</button>` : ''}
                        <button type="button" class="btn" data-act="edit" data-id="${s.id}">Uredi</button>
                        <button type="button" class="btn" data-act="delete" data-id="${s.id}">Odstrani</button>
                    </div>
                </div>
            </article>`;
        }).join('')
        : '<div class="empty">Ni najdenih predmetov.</div>';
    $('shown').textContent = `Prikazujem ${list.length} od ${data.subjects.length} predmetov`;
}

function renderYears() {
    const byYear = {};
    data.classes.forEach((c) => { (byYear[c.year] = byYear[c.year] || []).push(c.name); });
    $('years').innerHTML = Object.keys(byYear).sort().map((y) => `
        <div class="year">
            <div class="ylabel">${y}. letnik</div>
            <div class="classes">${byYear[y].map((c) => `<span class="class y${y}">${esc(c)}</span>`).join('')}</div>
        </div>`).join('') || '<div class="empty">Ni aktivnih razredov.</div>';
}

function renderAll() {
    renderStats();
    renderTabs();
    renderSubjects();
    renderYears();
}

async function load() {
    try {
        data = await Admin.api('subjects.php');
        renderAll();
    } catch (e) {
        if (e.status !== 401) $('subjects').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    }
}

const teacherOptions = (empty) => [{ value: '', label: empty }].concat(data.teachers.map((t) => ({ value: t.id, label: t.name })));
const classOptions = () => data.classes.map((c) => ({ value: c.id, label: c.name }));

async function addSubject() {
    const done = await Admin.modal({
        title: 'Dodaj predmet',
        fields: [
            { name: 'name', label: 'Ime predmeta', required: true, maxLength: 80 },
            { name: 'teacher_id', label: 'Učitelj', type: 'select', value: '', options: teacherOptions('— ni dodeljen —') },
            { name: 'class_ids', label: 'Razredi', type: 'checkboxes', value: [], options: classOptions() }
        ],
        submitLabel: 'Dodaj',
        onSubmit: (v) => Admin.api('subjects.php', { method: 'POST', body: v })
    });
    if (done) { data = done; renderAll(); Admin.toast('Predmet je dodan.'); }
}

async function editSubject(s) {
    const done = await Admin.modal({
        title: 'Uredi predmet',
        fields: [
            { name: 'name', label: 'Ime predmeta', required: true, maxLength: 80, value: s.name },
            { name: 'teacher_id', label: 'Učitelj', type: 'select', value: s.teacher_id || '', options: teacherOptions('— ni dodeljen —') },
            { name: 'class_ids', label: 'Razredi', type: 'checkboxes', value: s.class_ids, options: classOptions() }
        ],
        submitLabel: 'Shrani',
        onSubmit: (v) => Admin.api('subjects.php', { method: 'PUT', params: { id: s.id }, body: v })
    });
    if (done) { data = done; renderAll(); Admin.toast('Spremembe so shranjene.'); }
}

async function assignTeacher(s) {
    if (!data.teachers.length) { Admin.toast('Najprej dodaj učitelja v razdelku Uporabniki.', 'error'); return; }
    const done = await Admin.modal({
        title: 'Dodeli učitelja',
        description: `Predmet: ${s.name}`,
        fields: [{ name: 'teacher_id', label: 'Učitelj', type: 'select', required: true, value: '', options: teacherOptions('— izberi učitelja —') }],
        submitLabel: 'Dodeli',
        onSubmit: (v) => {
            if (!v.teacher_id) throw new Error('Izberi učitelja.');
            return Admin.api('subjects.php', { method: 'PUT', params: { id: s.id }, body: { teacher_id: v.teacher_id } });
        }
    });
    if (done) { data = done; renderAll(); Admin.toast('Učitelj je dodeljen.'); }
}

async function deleteSubject(s) {
    let result = null;
    const ok = await Admin.confirm({
        title: 'Odstrani predmet',
        text: `Predmet ${s.name} bo izbrisan. Dejanja ni mogoče preklicati.`,
        confirmLabel: 'Odstrani',
        danger: true,
        onConfirm: async () => { result = await Admin.api('subjects.php', { method: 'DELETE', params: { id: s.id } }); }
    });
    if (ok && result) { data = result; renderAll(); Admin.toast('Predmet je odstranjen.'); }
}

$('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    filter = btn.dataset.filter;
    renderTabs();
    renderSubjects();
});
$('search').addEventListener('input', (e) => {
    query = e.target.value;
    renderSubjects();
});
$('subjects').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const s = data.subjects.find((x) => x.id === Number(btn.dataset.id));
    if (!s) return;
    if (btn.dataset.act === 'assign') assignTeacher(s);
    if (btn.dataset.act === 'edit') editSubject(s);
    if (btn.dataset.act === 'delete') deleteSubject(s);
});
$('addBtn').addEventListener('click', addSubject);
$('plansBtn').addEventListener('click', () => Admin.toast('Učni načrti še niso na voljo.'));

(async () => {
    try { await Admin.init(); } catch (e) { return; }
    load();
})();
</script>
</body>
</html>
