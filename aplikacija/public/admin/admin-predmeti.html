<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predmeti</title>
<link href="admin-predmeti.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<nav class="sidebar" aria-label="Glavni meni">
    <a class="icon" href="admin-dashboard.html" aria-label="Nadzorna plošča" title="Nadzorna plošča">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </a>
    <a class="icon" href="admin_uporabniki.html" aria-label="Uporabniki" title="Uporabniki">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2c2.6.3 4.5 2.2 4.5 5.3"/></svg>
    </a>
    <a class="icon active" href="admin-predmeti.html" aria-label="Predmeti" aria-current="page" title="Predmeti">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>
    </a>
    <a class="icon" href="#" aria-label="Poročila" title="Poročila">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"/><path d="M7 20v-7"/><path d="M12 20V5"/><path d="M17 20v-10"/></svg>
    </a>
    <a class="icon" href="admin-koledar.html" aria-label="Koledar" title="Koledar">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
    </a>
    <div class="spacer"></div>
    <a class="icon" href="admin_nastavitve.html" aria-label="Nastavitve" title="Nastavitve">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10"/><path d="M18 7h2"/><path d="M4 17h2"/><path d="M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </a>
</nav>

<main class="content">

    <header class="page-header">
        <div>
            <h1>Predmeti in <span>razredi.</span></h1>
            <p>16 aktivnih razredov · 1 predmet brez učitelja</p>
        </div>
        <div class="actions">
            <button class="btn" type="button">Učni načrti</button>
            <button class="btn btn-primary" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                Dodaj predmet
            </button>
        </div>
    </header>

    <section class="stats" aria-label="Povzetek">
        <div class="stat"><div class="bar" style="background:#8e849e"></div><div class="body">
            <div class="label">Aktivni razredi</div><div class="num">16</div><div class="hint">4 letniki, 4 oddelki</div>
        </div></div>
        <div class="stat"><div class="bar" style="background:#7c8f55"></div><div class="body">
            <div class="label">Predmeti</div><div class="num" id="statSubjects">9</div><div class="hint">Z učnimi načrti</div>
        </div></div>
        <div class="stat"><div class="bar" style="background:#c96f4a"></div><div class="body">
            <div class="label">Brez učitelja</div><div class="num" id="statUnassigned">1</div><div class="hint">Potrebna dodelitev</div>
        </div></div>
    </section>

    <section aria-label="Seznam predmetov" style="display:flex; flex-direction:column; gap:20px">
        <div class="toolbar">
            <div class="tabs" id="tabs" role="group" aria-label="Filter predmetov"></div>
            <input class="search" id="search" type="search" placeholder="Išči predmet ali učitelja" aria-label="Išči predmete">
        </div>
        <div class="subjects" id="subjects"></div>
        <div class="count" id="shown"></div>
    </section>

    <section class="panel" aria-label="Razredi">
        <h2>Razredi po letnikih</h2>
        <div id="years"></div>
    </section>

</main>

<script>
const subjects = [
    { name: 'Matematika',     teacher: 'Maja Horvat',     classes: ['1.A', '2.A', '3.A', '4.A'] },
    { name: 'Slovenščina',    teacher: 'Tomaž Vidmar',    classes: ['1.B', '2.B', '3.B', '4.B'] },
    { name: 'Angleščina',     teacher: 'Sara Kolar',      classes: ['1.C', '2.C', '3.C'] },
    { name: 'Zgodovina',      teacher: 'Peter Zajc',      classes: ['2.D', '3.D'] },
    { name: 'Fizika',         teacher: 'Matej Golob',     classes: ['3.A', '4.A'] },
    { name: 'Biologija',      teacher: 'Katja Rozman',    classes: ['2.A', '2.B'] },
    { name: 'Kemija',         teacher: 'Urša Pirc',       classes: ['3.B', '3.C'] },
    { name: 'Geografija',     teacher: null,              classes: ['3.C'] },
    { name: 'Športna vzgoja', teacher: 'Boštjan Oražem',  classes: ['1.A', '1.B', '1.C', '1.D'] }
];
const years = [1, 2, 3, 4].map((y) => ({
    label: `${y}. letnik`,
    cls: `y${y}`,
    classes: ['A', 'B', 'C', 'D'].map((l) => `${y}.${l}`)
}));

const BARS = ['#7c8f55', '#8e849e', '#b8912a', '#c4875f'];
const AVATARS = [
    { bg: '#d4debf', fg: '#44561f' },
    { bg: '#d9d1e2', fg: '#4f4463' },
    { bg: '#ebddb0', fg: '#6e5410' },
    { bg: '#ebd3c4', fg: '#7a3a1c' }
];

let filter = 'vsi';
let query = '';

const $ = (id) => document.getElementById(id);
const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const initials = (name) => name.split(' ').map((p) => p[0]).join('');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const unassignedCount = () => subjects.filter((s) => !s.teacher).length;

function renderStats() {
    $('statSubjects').textContent = subjects.length;
    $('statUnassigned').textContent = unassignedCount();
}

function renderTabs() {
    const defs = [
        { id: 'vsi',  label: 'Vsi predmeti',  count: subjects.length },
        { id: 'brez', label: 'Brez učitelja', count: unassignedCount() }
    ];
    $('tabs').innerHTML = defs.map((t) =>
        `<button type="button" class="tab ${t.id === filter ? 'active' : ''}" data-filter="${t.id}" aria-pressed="${t.id === filter}">${t.label} <span>${t.count}</span></button>`
    ).join('');
}

function renderSubjects() {
    const q = norm(query.trim());
    const list = subjects
        .map((s, i) => ({ ...s, idx: i }))
        .filter((s) =>
            (filter === 'vsi' || !s.teacher) &&
            (!q || norm(s.name).includes(q) || (s.teacher && norm(s.teacher).includes(q)))
        );

    $('subjects').innerHTML = list.length
        ? list.map((s) => {
            const un = !s.teacher;
            const av = AVATARS[s.idx % 4];
            return `
            <article class="subject ${un ? 'unassigned' : ''}">
                <div class="bar" style="background:${un ? '#c96f4a' : BARS[s.idx % 4]}"></div>
                <div class="body">
                    <h2>${esc(s.name)}</h2>
                    <div class="teacher">
                        <div class="avatar" style="background:${un ? '#f5e6df' : av.bg}; color:${un ? '#8a3f1f' : av.fg}">${un ? '?' : esc(initials(s.teacher))}</div>
                        <div>
                            <div class="eyebrow">Učitelj</div>
                            <div class="tname" style="color:${un ? '#8a3f1f' : 'inherit'}">${un ? 'Ni dodeljen' : esc(s.teacher)}</div>
                        </div>
                    </div>
                    <div>
                        <div class="eyebrow">Razredi</div>
                        <div class="chips">${s.classes.map((c) => `<span class="chip">${esc(c)}</span>`).join('')}</div>
                    </div>
                    ${un ? '<button type="button" class="btn btn-primary">Dodeli učitelja</button>' : ''}
                </div>
            </article>`;
        }).join('')
        : '<div class="empty">Ni najdenih predmetov.</div>';

    $('shown').textContent = `Prikazujem ${list.length} od ${subjects.length} predmetov`;
}

function renderYears() {
    $('years').innerHTML = years.map((y) => `
        <div class="year">
            <div class="ylabel">${y.label}</div>
            <div class="classes">${y.classes.map((c) => `<span class="class ${y.cls}">${c}</span>`).join('')}</div>
        </div>`).join('');
}

$('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    filter = btn.dataset.filter;
    renderTabs();
    renderSubjects();
});
$('search').addEventListener('input', (e) => {
    query = e.target.value;
    renderSubjects();
});

renderStats();
renderTabs();
renderSubjects();
renderYears();
</script>
</body>
</html>
