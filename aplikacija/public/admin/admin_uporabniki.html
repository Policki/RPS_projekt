<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uporabniki</title>
<link rel="stylesheet" href="admin-uporabniki.css">
<link rel="stylesheet" href="css/admin-ui.css">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<nav class="sidebar" aria-label="Glavni meni">
    <a class="icon" href="admin-dashboard.html" aria-label="Nadzorna plošča" title="Nadzorna plošča">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </a>
    <a class="icon active" href="admin_uporabniki.html" aria-label="Uporabniki" aria-current="page" title="Uporabniki">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2c2.6.3 4.5 2.2 4.5 5.3"/></svg>
    </a>
    <a class="icon" href="admin-predmeti.html" aria-label="Predmeti" title="Predmeti">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>
    </a>
    <a class="icon" href="admin-koledar.html" aria-label="Koledar" title="Koledar">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
    </a>
    <div class="spacer"></div>
    <a class="icon" href="admin-nastavitve.html" aria-label="Nastavitve" title="Nastavitve">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10"/><path d="M18 7h2"/><path d="M4 17h2"/><path d="M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </a>
    <a class="icon" href="admin-profil.html" aria-label="Moj profil" title="Moj profil">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.2 18.2c1.2-2.2 3.2-3.2 5.8-3.2s4.6 1 5.8 3.2"/></svg>
    </a>
</nav>

<main class="content">

    <header class="page-header">
        <div>
            <h1>Vsi <span>uporabniki.</span></h1>
            <p id="headline">&nbsp;</p>
        </div>
        <div class="actions">
            <button class="btn" type="button" id="exportBtn">Izvozi seznam</button>
            <button class="btn btn-primary" type="button" id="addBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                Dodaj uporabnika
            </button>
        </div>
    </header>

    <section class="stats" aria-label="Povzetek">
        <div class="stat"><div class="bar" style="background:#c96f4a"></div><div class="body">
            <div class="label">Vsi računi</div><div class="num" id="stAll">0</div><div class="hint">Novi ta teden: <b id="stNew">0</b></div>
        </div></div>
        <div class="stat"><div class="bar" style="background:#7c8f55"></div><div class="body">
            <div class="label">Dijaki</div><div class="num" id="stStudents">0</div><div class="hint">Vseh razredov</div>
        </div></div>
        <div class="stat"><div class="bar" style="background:#b8912a"></div><div class="body">
            <div class="label">Učitelji</div><div class="num" id="stTeachers">0</div><div class="hint">V tem trenutku</div>
        </div></div>
        <div class="stat"><div class="bar" style="background:#8e849e"></div><div class="body">
            <div class="label">Starši</div><div class="num" id="stParents">0</div><div class="hint">Povezani z dijaki</div>
        </div></div>
    </section>

    <section class="panel" aria-label="Seznam uporabnikov">
        <div class="toolbar">
            <div class="tabs" id="tabs" role="group" aria-label="Filter po vlogi"></div>
            <input class="search" id="search" type="search" placeholder="Išči po imenu ali e-pošti" aria-label="Išči uporabnike">
        </div>

        <div class="table-wrap">
            <div class="table">
                <div class="row head">
                    <div>Uporabnik</div><div>Vloga</div><div>Povezava</div><div>Zadnja prijava</div><div>Status</div><div></div>
                </div>
                <div id="rows"></div>
            </div>
        </div>

        <div class="footer">
            <div id="shown"></div>
            <div class="pager">
                <button class="btn" type="button" id="prevBtn" disabled>Prejšnja</button>
                <button class="btn" type="button" id="nextBtn">Naslednja</button>
            </div>
        </div>
    </section>

</main>

<script src="js/admin.js"></script>
<script>
const ROLES = {
    dijak:   { label: 'Dijak' },
    ucitelj: { label: 'Učitelj' },
    stars:   { label: 'Starš' }
};
const STATUSES = {
    aktiven:   { label: 'Aktiven',        dot: '#6f8a3c', color: '#33401a' },
    caka:      { label: 'Čaka potrditev', dot: '#c96f4a', color: '#8a3f1f' },
    povabljen: { label: 'Povabljen',      dot: '#8b7f9e', color: '#4f4463' }
};
const TAB_LABELS = { vsi: 'Vsi', dijak: 'Dijaki', ucitelj: 'Učitelji', stars: 'Starši' };

let activeRole = 'vsi';
let query = '';
let page = 1;
let state = { users: [], total: 0, pages: 1, counts: { vsi: 0, dijak: 0, ucitelj: 0, stars: 0 }, summary: {}, classes: [], students: [] };
let requestSeq = 0;

const $ = (id) => document.getElementById(id);
const initials = (name) => name.split(' ').filter(Boolean).map((p) => p[0]).join('').slice(0, 3);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function renderTabs() {
    $('tabs').innerHTML = Object.keys(TAB_LABELS).map((id) =>
        `<button type="button" class="tab ${id === activeRole ? 'active' : ''}" data-role="${id}" aria-pressed="${id === activeRole}">${TAB_LABELS[id]} <span>${state.counts[id] || 0}</span></button>`
    ).join('');
}

function renderStats() {
    const s = state.summary;
    $('headline').textContent = `${s.active || 0} aktivnih računov · ${s.newWeek || 0} novih ta teden`;
    $('stAll').textContent = state.counts.vsi;
    $('stNew').textContent = s.newWeek || 0;
    $('stStudents').textContent = state.counts.dijak;
    $('stTeachers').textContent = state.counts.ucitelj;
    $('stParents').textContent = state.counts.stars;
}

function renderRows() {
    const list = state.users;
    $('rows').innerHTML = list.length
        ? list.map((u) => {
            const s = STATUSES[u.status];
            return `
            <div class="row" data-id="${u.id}">
                <div class="user">
                    <div class="avatar a-${u.role}">${esc(initials(u.name))}</div>
                    <div style="min-width:0">
                        <div class="name">${esc(u.name)}</div>
                        <div class="email">${esc(u.email)}</div>
                    </div>
                </div>
                <div><span class="pill r-${u.role}">${ROLES[u.role].label}</span></div>
                <div>${esc(u.detail)}</div>
                <div>${esc(Admin.fmtWhen(u.last))}</div>
                <div class="status" style="color:${s.color}"><i style="background:${s.dot}"></i>${s.label}</div>
                <button type="button" class="more" aria-label="Več možnosti" data-id="${u.id}">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
                </button>
            </div>`;
        }).join('')
        : '<div class="empty">Ni najdenih uporabnikov.</div>';

    const from = state.total ? (state.page - 1) * state.per + 1 : 0;
    const to = (state.page - 1) * state.per + list.length;
    $('shown').textContent = state.total
        ? `Prikazujem ${from}–${to} od ${state.total}`
        : 'Prikazujem 0 od 0';
    $('prevBtn').disabled = state.page <= 1;
    $('nextBtn').disabled = state.page >= state.pages;
}

async function load() {
    const seq = ++requestSeq;
    try {
        const data = await Admin.api('users.php', { params: { role: activeRole, q: query.trim(), page } });
        if (seq !== requestSeq) return; // prišel je novejši zahtevek
        state = data;
        page = data.page;
        renderTabs();
        renderStats();
        renderRows();
    } catch (e) {
        if (e.status !== 401) {
            $('rows').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
        }
    }
}

/* ---------- obrazec za dodajanje / urejanje ---------- */
function userFields(role, u) {
    const isEdit = !!u;
    const fields = [
        { name: 'ime', label: 'Ime', required: true, value: u ? u.ime : '', maxLength: 60, autocomplete: 'off' },
        { name: 'priimek', label: 'Priimek', value: u ? u.priimek : '', maxLength: 60, autocomplete: 'off' },
        { name: 'email', label: 'E-pošta', type: 'email', required: true, value: u ? u.email : '', maxLength: 190, autocomplete: 'off' }
    ];
    if (!isEdit) {
        fields.push({
            name: 'role', label: 'Vloga', type: 'select', value: 'dijak',
            options: [{ value: 'dijak', label: 'Dijak' }, { value: 'ucitelj', label: 'Učitelj' }, { value: 'stars', label: 'Starš' }]
        });
    }
    const roleIs = (r) => (v) => (isEdit ? role === r : v.role === r);
    fields.push({
        name: 'class_id', label: 'Razred', type: 'select', value: u && u.class_id ? u.class_id : '',
        options: [{ value: '', label: '— brez razreda —' }].concat(state.classes.map((c) => ({ value: c.id, label: c.name }))),
        showIf: roleIs('dijak')
    });
    fields.push({
        name: 'child_id', label: 'Otrok (dijak)', type: 'select', value: u && u.child_id ? u.child_id : '',
        options: [{ value: '', label: '— brez povezave —' }].concat(state.students.map((s) => ({ value: s.id, label: s.name }))),
        showIf: roleIs('stars')
    });
    fields.push({
        name: 'status', label: 'Status', type: 'select', value: u ? u.status : 'povabljen',
        options: Object.keys(STATUSES).map((k) => ({ value: k, label: STATUSES[k].label }))
    });
    fields.push({
        name: 'password', label: isEdit ? 'Novo geslo (neobvezno)' : 'Začasno geslo (neobvezno)', type: 'password',
        minLength: 8, autocomplete: 'new-password',
        hint: isEdit ? 'Pusti prazno, če gesla ne želiš spremeniti.' : 'Če je prazno, se uporabnik ne more prijaviti, dokler ni nastavljeno geslo.'
    });
    return fields;
}

async function openAdd() {
    const done = await Admin.modal({
        title: 'Dodaj uporabnika',
        fields: userFields(null, null),
        submitLabel: 'Dodaj',
        onSubmit: (v) => Admin.api('users.php', { method: 'POST', body: v })
    });
    if (done) { Admin.toast('Uporabnik je dodan.'); page = 1; load(); }
}

async function openEdit(u) {
    const done = await Admin.modal({
        title: 'Uredi uporabnika',
        fields: userFields(u.role, u),
        submitLabel: 'Shrani',
        onSubmit: (v) => Admin.api('users.php', { method: 'PUT', params: { id: u.id }, body: v })
    });
    if (done) { Admin.toast('Spremembe so shranjene.'); load(); }
}

async function approve(u) {
    try {
        await Admin.api('users.php', { method: 'PUT', params: { id: u.id }, body: { action: 'approve' } });
        Admin.toast(`Vpis uporabnika ${u.name} je potrjen.`);
        load();
    } catch (e) { Admin.toast(e.message, 'error'); }
}

async function remove(u) {
    const ok = await Admin.confirm({
        title: 'Odstrani uporabnika',
        text: `Račun ${u.name} (${u.email}) bo trajno izbrisan. Dejanja ni mogoče preklicati.`,
        confirmLabel: 'Odstrani',
        danger: true,
        onConfirm: () => Admin.api('users.php', { method: 'DELETE', params: { id: u.id } })
    });
    if (ok) { Admin.toast('Uporabnik je odstranjen.'); load(); }
}

/* ---------- dogodki ---------- */
$('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    activeRole = btn.dataset.role;
    page = 1;
    load();
});

let searchTimer;
$('search').addEventListener('input', (e) => {
    query = e.target.value;
    page = 1;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(load, 250);
});

$('prevBtn').addEventListener('click', () => { if (page > 1) { page--; load(); } });
$('nextBtn').addEventListener('click', () => { if (page < state.pages) { page++; load(); } });
$('addBtn').addEventListener('click', openAdd);

$('exportBtn').addEventListener('click', async () => {
    try {
        await Admin.download('users.php', { export: 'csv' }, `uporabniki-${new Date().toISOString().slice(0, 10)}.csv`);
    } catch (e) { Admin.toast(e.message, 'error'); }
});

$('rows').addEventListener('click', (e) => {
    const btn = e.target.closest('.more');
    if (!btn) return;
    const u = state.users.find((x) => x.id === Number(btn.dataset.id));
    if (!u) return;
    const items = [{ label: 'Uredi', onClick: () => openEdit(u) }];
    if (u.status === 'caka') items.unshift({ label: 'Potrdi vpis', onClick: () => approve(u) });
    items.push({ label: 'Odstrani', danger: true, onClick: () => remove(u) });
    Admin.menu(btn, items);
});

(async () => {
    try { await Admin.init(); } catch (e) { return; }
    renderTabs();
    load();
})();
</script>
</body>
</html>
