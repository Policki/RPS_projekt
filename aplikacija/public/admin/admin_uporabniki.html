<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uporabniki</title>
<link rel="stylesheet" href="/admin/admin-uporabniki.css">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/skupno/skupno.css">
<script src="/skupno/api.js" defer></script>
<script src="/skupno/navigacija.js" defer></script>
<script src="/admin/admin.js" defer></script>
<link rel="stylesheet" href="/skupno/navigacija.css">
</head>
<body>

<nav class="sidebar" aria-label="Glavna navigacija">
        <div class="icon" title="Nadzorna plošča"><a href="/admin-dashboard" aria-label="Nadzorna plošča"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></a></div>
        <div class="icon active" title="Uporabniki"><a href="/admin/admin_uporabniki.html" aria-label="Uporabniki" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2c2.6.3 4.5 2.2 4.5 5.3"/></svg></a></div>
        <div class="icon" title="Predmeti"><a href="/admin/admin-predmeti.html" aria-label="Predmeti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></a></div>
        <div class="icon" title="Koledar"><a href="/admin/admin-koledar.html" aria-label="Koledar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></a></div>
        <div class="spacer"></div>
        <div class="icon" title="Profil"><a href="/profil" aria-label="Profil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></a></div>
        <div class="icon" title="Nastavitve"><a href="/admin/admin-nastavitve.html" aria-label="Nastavitve"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m9 3 1-1h4l1 3 3 1 3 1v4l-2 2v3l-2 3-3-1-3 2-3-2-3-1v-4l-2-2V7l3-1 1-3z"/></svg></a></div>
    </nav>

<main class="content">

    <header class="page-header">
        <div>
            <h1>Vsi <span>uporabniki.</span></h1>
            <p>624 aktivnih računov · 9 novih ta teden</p>
        </div>
        <div class="actions">
            <button class="btn" type="button">Izvozi seznam</button>
            <button class="btn btn-primary" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                Dodaj uporabnika
            </button>
        </div>
    </header>

    <section class="stats" aria-label="Povzetek">
        <div class="stat"><div class="bar" style="background:#c96f4a"></div><div class="body">
            <div class="label">Vsi računi</div><div class="num">624</div><div class="hint">Novi ta teden: <b>9</b></div>
        </div></div>
        <div class="stat"><div class="bar" style="background:#7c8f55"></div><div class="body">
            <div class="label">Dijaki</div><div class="num">342</div><div class="hint">Vseh razredov</div>
        </div></div>
        <div class="stat"><div class="bar" style="background:#b8912a"></div><div class="body">
            <div class="label">Učitelji</div><div class="num">24</div><div class="hint">V tem trenutku</div>
        </div></div>
        <div class="stat"><div class="bar" style="background:#8e849e"></div><div class="body">
            <div class="label">Starši</div><div class="num">258</div><div class="hint">Povezani z dijaki</div>
        </div></div>
    </section>

    <section class="panel" aria-label="Seznam uporabnikov">
        <div class="toolbar">
            <div class="tabs" id="tabs" role="group" aria-label="Filter po vlogi"></div>
            <input class="search" id="search" type="search" placeholder="Išči po imenu ali e-pošti" aria-label="Išči uporabnike">
        </div>

        <div class="table-wrap">
            <div class="table">
                <div class="row head">
                    <div>Uporabnik</div><div>Vloga</div><div>Povezava</div><div>Zadnja prijava</div><div>Status</div><div></div>
                </div>
                <div id="rows"></div>
            </div>
        </div>

        <div class="footer">
            <div id="shown"></div>
            <div class="pager">
                <button class="btn" type="button" disabled>Prejšnja</button>
                <button class="btn" type="button">Naslednja</button>
            </div>
        </div>
    </section>

</main>


<script src="/admin/admin_uporabniki.js"></script>
</body>
</html>
