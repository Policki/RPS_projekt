<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nadzorna plošča</title>
<link href="/admin/admin-dashboard.css" rel="stylesheet">
<link rel="stylesheet" href="/skupno/skupno.css">
<script src="/skupno/api.js" defer></script>
<script src="/skupno/navigacija.js" defer></script>
<script src="/admin/admin.js" defer></script>
<link rel="stylesheet" href="/skupno/navigacija.css">
</head>

<nav class="sidebar" aria-label="Glavna navigacija">
        <div class="icon active" title="Nadzorna plošča"><a href="/admin-dashboard" aria-label="Nadzorna plošča" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></a></div>
        <div class="icon" title="Uporabniki"><a href="/admin/admin_uporabniki.html" aria-label="Uporabniki"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2c2.6.3 4.5 2.2 4.5 5.3"/></svg></a></div>
        <div class="icon" title="Predmeti"><a href="/admin/admin-predmeti.html" aria-label="Predmeti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></a></div>
        <div class="icon" title="Koledar"><a href="/admin/admin-koledar.html" aria-label="Koledar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></a></div>
        <div class="spacer"></div>
        <div class="icon" title="Profil"><a href="/profil" aria-label="Profil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></a></div>
        <div class="icon" title="Nastavitve"><a href="/admin/admin-nastavitve.html" aria-label="Nastavitve"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m9 3 1-1h4l1 3 3 1 3 1v4l-2 2v3l-2 3-3-1-3 2-3-2-3-1v-4l-2-2V7l3-1 1-3z"/></svg></a></div>
    </nav>


<body>

<main class="content">

    <header class="page-header">
        <h1><span id="greeting">Dobro jutro</span>, <span>Admin.</span></h1>
        <p id="subtitle"></p>
    </header>

    <div class="top">

        <section class="overview" aria-labelledby="pregled">
            <h2 id="pregled">Pregled sistema</h2>

            <a class="line l-rose" href="/admin/admin_uporabniki.html">
                <div>
                    <div class="t">Vpisi za potrditev</div>
                    <div class="d">Novi dijaki tekočega tedna</div>
                </div>
                <span class="badge" id="pendingBadge"></span>
            </a>

            <a class="line l-green" href="/admin/admin_uporabniki.html">
                <div>
                    <div class="t">Aktivni dijaki</div>
                    <div class="d">Vseh razredov</div>
                </div>
                <span class="badge" id="studentsBadge"></span>
            </a>

            <a class="line l-sand" href="/admin/admin_uporabniki.html">
                <div>
                    <div class="t">Aktivni učitelji</div>
                    <div class="d">V tem trenutku</div>
                </div>
                <span class="badge" id="teachersBadge"></span>
            </a>
        </section>

        <div class="right">
            <section class="side-card" aria-labelledby="streznik">
                <h2 id="streznik">Zasedenost strežnika</h2>
                <div class="meter"><div id="diskBar"></div></div>
                <div class="big" id="diskText"></div>
                <div class="note" id="backupText"></div>
            </section>

            <section class="side-card uptime" aria-label="Razpoložljivost">
                <svg viewBox="0 0 100 100" role="img" id="uptimeRing">
                    <circle cx="50" cy="50" r="40" fill="none" stroke="#ece6da" stroke-width="12"/>
                    <circle id="uptimeArc" cx="50" cy="50" r="40" fill="none" stroke="#b0502b" stroke-width="12" stroke-linecap="round" transform="rotate(-90 50 50)"/>
                </svg>
                <div>
                    <div class="eyebrow">Ta mesec</div>
                    <div class="val" id="uptimeText"></div>
                </div>
            </section>
        </div>
    </div>

    <section class="shortcuts" aria-label="Bližnjice">

        <a class="shortcut s-users" href="/admin/admin_uporabniki.html">
            <div class="bar"></div>
            <div class="body">
                <div class="head">
                    <div class="ico">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2c2.6.3 4.5 2.2 4.5 5.3"/></svg>
                    </div>
                    <div>
                        <div class="name">Uporabniki</div>
                        <div class="desc">Dijaki, učitelji, starši</div>
                    </div>
                </div>
                <div class="main" id="usersMain"></div>
                <div class="extra">Novi ta teden: <span id="usersNew"></span></div>
                <div class="track"><div style="width:55%"></div></div>
            </div>
        </a>

        <a class="shortcut s-subj" href="/admin/admin-predmeti.html">
            <div class="bar"></div>
            <div class="body">
                <div class="head">
                    <div class="ico">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>
                    </div>
                    <div>
                        <div class="name">Predmeti</div>
                        <div class="desc">Učni načrti in razredi</div>
                    </div>
                </div>
                <div class="main" id="classesMain"></div>
                <div class="extra">Brez učitelja: <span id="noTeacher"></span></div>
                <div class="track"><div style="width:55%"></div></div>
            </div>
        </a>

    </section>
</main>


<script src="/admin/admin-dashboard.js"></script>
</body>
</html>
