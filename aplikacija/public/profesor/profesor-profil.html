    <main class="main-container">
        <header class="header">
            <h1>Profil<span>.</span></h1>
            <p>Vaši osebni podatki in povzetek računa.</p>
        </header>
        <div class="crta"></div>
        <div class="dva-stolpca profil-stolpca">
            <section class="card">
                <h2>Osebni podatki</h2>
                <form class="obrazec" onsubmit="return false">
                    <label>Ime in priimek<input type="text" value="[Ime Priimek]"></label>
                    <label>E-pošta<input type="email" value="ime.priimek@sola.si"></label>
                    <label>Telefon<input type="tel" placeholder="/"></label>
                    <label>Predmeti<input type="text" value="UPP, SPA, RPS, RKO, OPR"></label>
                    <button class="gumb" type="submit">Shrani spremembe</button>
                </form>
            </section>
            <div class="desno">
                <section class="card card-accent profil-kartica">
                    <div class="avatar" aria-hidden="true">GH</div>
                    <h2>g. Holobar</h2>
                    <p class="opomba">Profesor</p>
                </section>
                <section class="card card-accent">
                    <h2>Povzetek</h2>
                    <div class="vrstice">
                <div class="vrstica roza"><div><h3>Razredi</h3><p>v tem šolskem letu</p></div><span class="pill">5</span></div>
                <div class="vrstica zelena"><div><h3>Nalog za pregled</h3><p>trenutno</p></div><span class="pill">12</span></div>
                <div class="vrstica rumena"><div><h3>Ur danes</h3><p>po urniku</p></div><span class="pill">3</span></div>
                    </div>
                </section>
            </div>
        </div>
    </main>
</div>
</body>
</html>
