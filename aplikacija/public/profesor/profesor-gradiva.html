<body>
<div class="all-content">
    <nav class="sidebar" aria-label="Glavna navigacija">
        <div class="icon" title="Nadzorna plošča"><a href="/profesor-dashboard" aria-label="Nadzorna plošča"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></a></div>

        <div class="icon" title="Koledar"><a href="/profesor/profesor-koledar.html" aria-label="Koledar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></a></div>
        <div class="spacer"></div>
        <div class="icon" title="Profil"><a href="/profil" aria-label="Profil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></a></div>
        <div class="icon" title="Nastavitve"><a href="/profesor/profesor-nastavitve.html" aria-label="Nastavitve"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m9 3 1-1h4l1 3 3 1 3 1v4l-2 2v3l-2 3-3-1-3 2-3-2-3-1v-4l-2-2V7l3-1 1-3z"/></svg></a></div>
    </nav>
    <main class="main-container">
        <header class="header">
            <h1>Gradiva<span>.</span></h1>
            <p>Učno gradivo po predmetih.</p>
        </header>
        <div class="crta"></div>
        <div class="dva-stolpca">
            <section class="card"><h2>Nedavna gradiva</h2><div class="vrstice" id="gradiva-seznam">
                <div class="vrstica zelena"><div><h3>Gradivo [naziv]</h3><p>UPP · R3A</p></div><span class="pill">PDF</span></div>
                <div class="vrstica roza"><div><h3>Gradivo [naziv]</h3><p>RPS · R4A</p></div><span class="pill">PPT</span></div>
                <div class="vrstica rumena"><div><h3>Gradivo [naziv]</h3><p>OPR · R3A</p></div><span class="pill">DOC</span></div>
                <div class="vrstica zelena"><div><h3>Gradivo [naziv]</h3><p>SPA · R1B</p></div><span class="pill">PDF</span></div>
                <div class="vrstica roza"><div><h3>Gradivo [naziv]</h3><p>RKO · R2B</p></div><span class="pill">URL</span></div>
            </div></section>
            <section class="card card-accent">
                <h2>Dodaj gradivo</h2>
                <p class="opomba">Naložite datoteko ali dodajte povezavo.</p>
                <select id="gradivo-predmet" class="izbira-predmeta" aria-label="Predmet"></select>
                <input type="file" id="gradivo-datoteka" accept=".pdf,.ppt,.pptx,.doc,.docx" hidden>
                <button class="gumb" type="button" id="btnNaloziDatoteko">Naloži datoteko</button>
                <button class="gumb" type="button" id="btnDodajPovezavo">Dodaj povezavo</button>
                <p class="opomba" id="gradivo-sporocilo"></p>
            </section>
        </div>
    </main>
</div>
<script src="/profesor/DB.js"></script>
<script src="/profesor/profesor.js"></script>
<script src="/profesor/profesor-gradiva.js"></script>
