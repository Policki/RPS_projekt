<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="/skupno/navigacija.js" defer></script>

</head>
<body>
<div class="all-content">
    <nav class="sidebar" aria-label="Glavna navigacija">
        <div class="icon active" title="Nadzorna plošča"><a href="/profesor-dashboard" aria-label="Nadzorna plošča" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></a></div>
        <div class="icon" title="Predmeti"><a href="/profesor/profesor-predmeti.html" aria-label="Predmeti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></a></div>
        <div class="icon" title="Naloge"><a href="/profesor/profesor-naloge.html" aria-label="Naloge"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m8 12 2.5 2.5L16 9"/></svg></a></div>
        <div class="icon" title="Gradiva"><a href="/profesor/profesor-gradiva.html" aria-label="Gradiva"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg></a></div>
        <div class="icon" title="Koledar"><a href="/profesor/profesor-koledar.html" aria-label="Koledar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></a></div>
        <div class="spacer"></div>
        <div class="icon" title="Profil"><a href="/profil" aria-label="Profil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></a></div>
        <div class="icon" title="Nastavitve"><a href="/profesor/profesor-nastavitve.html" aria-label="Nastavitve"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m9 3 1-1h4l1 3 3 1 3 1v4l-2 2v3l-2 3-3-1-3 2-3-2-3-1v-4l-2-2V7l3-1 1-3z"/></svg></a></div>
    </nav>
    <main class="main-container">
        <header class="header">
            <h1>Dobro jutro, <span id="profil-ime">(ime uporabnika)</span></h1>
            <p id="opis-dashboard">Nalagam urnik ...</p>
        </header>
        <div class="crta"></div>
        <div class="dva-stolpca">
            <section class="card">
                <h2>Današnji dogodki</h2>
                <div class="vrstice" id="dogodki-danes">
                </div>
            </section>
            <div class="desno">
                <section class="card card-accent">
                    <h2>Najbližji rok oddaje</h2>
                    <div class="rok-vrstica"><div id="rok-crta"></div></div>
                    <p class="rok-predmet" id="rok-predmet">Predmet</p>
                    <p class="rok-datum" id="rok-datum">Datum</p>
                </section>
                <section class="card card-accent">
                    <h2>Opravljene obveznosti</h2>
                    <div class="obroc">
                        <svg width="72" height="72" viewBox="0 0 72 72" fill="none" aria-hidden="true">
                            <circle cx="36" cy="36" r="28" stroke="#E8DFD2" stroke-width="8"/>
                            <circle id="obroc-krog" cx="36" cy="36" r="28" stroke="#CF6B49" stroke-width="8" stroke-dasharray="132 176" stroke-linecap="round" transform="rotate(-90 36 36)"/>
                        </svg>
                        <div><small>TA TEDEN:</small><strong id="obroc-besedilo">18/24 nalog pregledanih</strong></div>
                    </div>
                </section>
            </div>
        </div>
        <div class="predmeti" id="predmeti-seznam" data-najvec="3"></div>
    </main>
</div>
<script src="/profesor/DB.js"></script>
<script src="/profesor/profesor.js"></script>
<script src="/profesor/profesor-dashboard.js"></script>
</body>
</html>
