<!DOCTYPE html>
<html lang="sl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <title>Prijava</title>
</head>

<body>
    <div class="background-shape"></div>

    <div class="login-container">
        <h2 class="h2">Dobrodošli</h2>
        <p class="login-p">Prijavite se v svoj račun</p>

        <form action="/login" method="post">
            <label for="username" class="login-label">Uporabniško ime:</label> <br>
            <input type="text" id="username" class="login-input" name="username" required>
            <br>
            <label for="password" class="login-label">Geslo:</label> <br>
            <input type="password" id="password" class="login-input" name="password" required>
            <br>
            <button type="submit" class="submit">VPIS</button>
        </form>

        <p class="pozabljeno"><a href="/forgot-password">Pozabljeno geslo?</a></p>
    </div>
</body>

</html>
